<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade: Funções JS - Sibelle</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .credito {
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 25px;
            font-style: italic;
        }
        .mensagem {
            font-size: 16px;
            color: #3c4043;
            min-height: 50px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .botao {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .botao:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Curiosidades sobre Tecnologia</h1>
        <div class="credito">Desenvolvido por: Sibelle Larissa Roziski</div>
        
        <p class="mensagem">Clique no botão abaixo para descobrir um fato curioso sobre o mundo digital!</p>
        <button class="botao">Descobrir Fato</button>
    </div>

    <script>
        /* 
          Lógica e Estilo Dinâmico - Funções em JavaScript
          Autora: Sibelle Larissa Roziski
        */

        // Seleção dos elementos HTML
        const botao = document.querySelector(".botao");
        const mensagem = document.querySelector(".mensagem");
        const container = document.querySelector(".container");

        // Função que altera o conteúdo e o estilo da página
        function mostrarMensagem() {
            // Alteração do texto
            mensagem.textContent = "O primeiro bug de computador da história foi causado por uma mariposa real presa dentro de um relé em 1947! Daí surgiu o termo 'debugging'.";
            
            // Alteração de estilos em tempo real (CSS via JS)
            mensagem.style.color = "#0b8043"; 
            mensagem.style.fontWeight = "600";
            
            // Altera o botão para o estado de concluído
            botao.textContent = "Fato Descoberto!";
            botao.style.backgroundColor = "#0b8043";
            
            // Adiciona uma borda verde de sucesso no container
            container.style.border = "2px solid #0b8043";
        }

        // Evento que dispara a função através do clique no botão
        botao.addEventListener("click", mostrarMensagem);
    </script>

</body>
</html>
